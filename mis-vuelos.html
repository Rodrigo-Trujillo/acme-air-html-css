<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mis vuelos | ACME AIR</title>
  <meta name="description" content="Listado de vuelos reservados y vuelos previos en ACME AIR">
  <link rel="icon" href="imagen/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/forms.css">
  <link rel="stylesheet" href="css/layout.css">
  <link rel="stylesheet" href="css/responsive.css">
</head>
<body>
  <header class="app-header">
    <img class="app-header__logo" src="imagen/logo-blanco.svg" alt="ACME AIR - Flying to your dreams">
  </header>

  <main class="app-card app-card--ancha">
    <div class="usuario">
      <img class="usuario__avatar" src="imagen/iconos/avatar.svg" alt="Avatar de John Doe">
      <div class="usuario__datos">
        <p class="usuario__nombre">John Doe</p>
        <a class="usuario__salir" href="index.html">Cerrar Sesión</a>
      </div>
    </div>

    <h1>Mis Vuelos</h1>
    <section class="lista-vuelos" aria-label="Listado de vuelos">
      <div class="tarjeta tarjeta--vuelo">
        <img class="tarjeta__icono" src="imagen/iconos/avion-despegando.svg" alt="">
        <div class="tarjeta__datos">
          <p class="tarjeta__detalle">05:30 - 06:30</p>
          <p class="tarjeta__detalle tarjeta__detalle--fuerte">1h 30 min</p>
          <p class="tarjeta__detalle">Sep 29</p>
        </div>
        <div class="tarjeta__lateral">
          <p class="tarjeta__detalle">VAA025</p>
          <p class="estado">A tiempo</p>
          <p class="tarjeta__detalle">Bogotá - Barranquilla</p>
        </div>
      </div>
      <div class="tarjeta tarjeta--vuelo">
        <img class="tarjeta__icono" src="imagen/iconos/avion-despegando.svg" alt="">
        <div class="tarjeta__datos">
          <p class="tarjeta__detalle">10:30 - 12:00</p>
          <p class="tarjeta__detalle tarjeta__detalle--fuerte">1h 30 min</p>
          <p class="tarjeta__detalle">Jul 05</p>
        </div>
        <div class="tarjeta__lateral">
          <p class="tarjeta__detalle">VAA185</p>
          <p class="estado">Aterrizó</p>
          <p class="tarjeta__detalle">Bogotá - Barranquilla</p>
        </div>
      </div>
      <div class="tarjeta tarjeta--vuelo">
        <img class="tarjeta__icono" src="imagen/iconos/avion-despegando.svg" alt="">
        <div class="tarjeta__datos">
          <p class="tarjeta__detalle">05:30 - 06:30</p>
          <p class="tarjeta__detalle tarjeta__detalle--fuerte">1h 30 min</p>
          <p class="tarjeta__detalle">Feb 04</p>
        </div>
        <div class="tarjeta__lateral">
          <p class="tarjeta__detalle">VAA800</p>
          <p class="estado">Aterrizó</p>
          <p class="tarjeta__detalle">Bogotá - Barranquilla</p>
        </div>
      </div>
    </section>
    <a class="btn btn-primario" href="menu.html" title="Volver al menú principal">Volver</a>
  </main>

  <footer class="app-footer">
    <small>© 2026 ACME AIR</small>
  </footer>
</body>
</html>
