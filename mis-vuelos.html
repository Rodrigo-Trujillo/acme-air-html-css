<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mis vuelos | ACME AIR</title>
  <meta name="description" content="Listado de vuelos reservados y vuelos previos en ACME AIR">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/forms.css">
  <link rel="stylesheet" href="css/layout.css">
  <link rel="stylesheet" href="css/responsive.css">
</head>
<body>
  <header class="app-header">
    <img class="app-header__icono" src="imagen/iconos/avion-blanco.svg" alt="">
    <p class="app-header__marca">ACME AIR – Flying to your dreams</p>
  </header>

  <main class="app-card">
    <div class="usuario">
      <img class="usuario__avatar" src="imagen/iconos/avatar.svg" alt="Avatar de John Doe">
      <div class="usuario__datos">
        <p class="usuario__nombre">John Doe</p>
        <a class="usuario__salir" href="index.html">Cerrar Sesión</a>
      </div>
    </div>

    <h1 class="titulo-divisor">Mis vuelos</h1>
    <section class="lista-vuelos" aria-label="Listado de vuelos">
      <div class="tarjeta tarjeta--vuelo">
        <div class="tarjeta__datos">
          <p class="tarjeta__titulo">VAA025</p>
          <p class="tarjeta__detalle">Bogotá - Barranquilla · Sep 29</p>
        </div>
        <span class="estado estado--a-tiempo">A tiempo</span>
      </div>
      <div class="tarjeta tarjeta--vuelo">
        <div class="tarjeta__datos">
          <p class="tarjeta__titulo">VAA140</p>
          <p class="tarjeta__detalle">Medellín - Cartagena · Oct 12</p>
        </div>
        <span class="estado estado--a-tiempo">A tiempo</span>
      </div>
      <div class="tarjeta tarjeta--vuelo">
        <div class="tarjeta__datos">
          <p class="tarjeta__titulo">VAA087</p>
          <p class="tarjeta__detalle">Cali - Bogotá · Sep 15</p>
        </div>
        <span class="estado estado--aterrizo">Aterrizó</span>
      </div>
    </section>
    <a class="btn btn-primario" href="menu.html">Volver al menú principal</a>
  </main>

  <footer class="app-footer">
    <small>© 2026 ACME AIR</small>
  </footer>
</body>
</html>
