<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Crear cuenta | ACME AIR</title>
  <meta name="description" content="Registro de nuevos usuarios en ACME AIR">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/forms.css">
  <link rel="stylesheet" href="css/layout.css">
  <link rel="stylesheet" href="css/responsive.css">
</head>
<body>
  <header class="app-header">
    <img class="app-header__icono" src="imagen/iconos/avion-blanco.svg" alt="">
    <p class="app-header__marca">ACME AIR – Flying to your dreams</p>
  </header>

  <main class="app-card">
    <h1>Crear cuenta</h1>
    <form class="form" action="crear-contraseña.html" method="get">
      <div class="campo">
        <label class="sr-only" for="nombre">Nombre completo</label>
        <input class="campo__input" type="text" id="nombre" name="nombre" placeholder="Nombre completo" autocomplete="name">
      </div>
      <div class="campo">
        <label class="sr-only" for="identificacion">Identificación</label>
        <input class="campo__input" type="text" id="identificacion" name="identificacion" placeholder="Identificación" inputmode="numeric">
      </div>
      <div class="campo">
        <label class="sr-only" for="email">Correo electrónico</label>
        <input class="campo__input" type="email" id="email" name="email" placeholder="Correo electrónico" autocomplete="email">
      </div>
      <div class="campo">
        <label class="sr-only" for="telefono">Teléfono</label>
        <input class="campo__input" type="tel" id="telefono" name="telefono" placeholder="Teléfono" autocomplete="tel">
      </div>
      <div class="campo">
        <label class="sr-only" for="ciudad">Ciudad</label>
        <select class="campo__input" id="ciudad" name="ciudad">
          <option value="" disabled selected>Ciudad</option>
          <option>Bogotá</option>
          <option>Medellín</option>
          <option>Cali</option>
          <option>Barranquilla</option>
          <option>Cartagena</option>
        </select>
      </div>
      <button class="btn btn-primario" type="submit">Guardar</button>
    </form>
  </main>

  <footer class="app-footer">
    <small>© 2026 ACME AIR</small>
  </footer>
</body>
</html>
