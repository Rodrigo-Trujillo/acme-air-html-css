<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Iniciar sesión | ACME AIR</title>
  <meta name="description" content="Inicio de sesión de ACME AIR">
  <link rel="icon" href="imagen/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/forms.css">
  <link rel="stylesheet" href="css/layout.css">
  <link rel="stylesheet" href="css/responsive.css">
</head>
<body>
  <header class="login-logo">
    <img class="login-logo__imagen" src="imagen/logo.png" alt="ACME AIR - Flying to your dreams">
  </header>

  <main class="app-card app-card--plana">
    <h1>Iniciar Sesión</h1>
    <form class="form" action="menu.html" method="get">
      <div class="campo">
        <label class="sr-only" for="email">Email</label>
        <input class="campo__input" type="email" id="email" name="email" placeholder="Email" autocomplete="email">
      </div>
      <div class="campo">
        <label class="sr-only" for="password">Contraseña</label>
        <input class="campo__input" type="password" id="password" name="password" placeholder="Contraseña" autocomplete="current-password">
      </div>
      <label class="check">
        <input class="check__input" type="checkbox" name="recordar">
        <span>Recordar mis datos</span>
      </label>
      <button class="btn btn-primario" type="submit">Ingresar</button>
      <p class="form__enlaces">
        <a href="registro.html">Crear cuenta</a>
        <a href="recuperar.html">¿Has olvidado tu contraseña?</a>
      </p>
    </form>
  </main>

  <footer class="app-footer">
    <small>© 2026 ACME AIR</small>
  </footer>
</body>
</html>
