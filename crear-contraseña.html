<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Crear contraseña | ACME AIR</title>
  <meta name="description" content="Crear una nueva contraseña en ACME AIR">
  <link rel="icon" href="imagen/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/forms.css">
  <link rel="stylesheet" href="css/layout.css">
  <link rel="stylesheet" href="css/responsive.css">
</head>
<body>
  <header class="app-header">
    <img class="app-header__logo" src="imagen/logo-blanco.svg" alt="ACME AIR - Flying to your dreams">
  </header>

  <main class="app-card">
    <h1 class="titulo-divisor">Crear Contraseña</h1>
    <form class="form" action="menu.html" method="get">
      <div class="campo">
        <label class="sr-only" for="password">Contraseña</label>
        <input class="campo__input" type="password" id="password" name="password" placeholder="Contraseña" autocomplete="new-password">
      </div>
      <div class="campo">
        <label class="sr-only" for="password-repetir">Repetir Contraseña</label>
        <input class="campo__input" type="password" id="password-repetir" name="password-repetir" placeholder="Repetir Contraseña" autocomplete="new-password">
      </div>
      <button class="btn btn-primario" type="submit">Guardar</button>
    </form>
  </main>

  <footer class="app-footer">
    <small>© 2026 ACME AIR</small>
  </footer>
</body>
</html>
