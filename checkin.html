<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Registro de Entrada | ACME AIR</title>
  <meta name="description" content="Realiza tu registro de entrada en ACME AIR">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/formularios.css">
  <link rel="stylesheet" href="css/layout.css">
  <link rel="stylesheet" href="css/responsive.css">
</head>
<body>
  <header class="app-header">
    <img class="app-header__icono" src="imagen/iconos/avion-blanco.svg" alt="">
    <p class="app-header__marca">ACME AIR – Flying to your dreams</p>
  </header>

  <main class="app-card">
    <h1 class="titulo-divisor">Registro de Entrada</h1>

    <form action="#" method="post">
      <div class="form-grupo">
        <label for="nombre">Nombre completo</label>
        <input type="text" id="nombre" class="form-control" required>
      </div>

      <div class="form-grupo">
        <label for="documento">Número de documento</label>
        <input type="text" id="documento" class="form-control" required>
      </div>

      <div class="form-grupo">
        <label for="asiento">Número de asiento</label>
        <input type="text" id="asiento" class="form-control" required>
      </div>

      <button type="submit" class="btn btn-principal">Confirmar</button>
    </form>

    <a href="vuelos.html" class="btn btn-secundario">Volver a vuelos</a>
  </main>

  <footer class="app-footer">
    <small>© 2026 ACME AIR</small>
  </footer>
</body>
</html>
