<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Check In | ACME AIR</title>
  <meta name="description" content="Check In de tu vuelo en ACME AIR">
  <link rel="icon" href="imagen/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/forms.css">
  <link rel="stylesheet" href="css/layout.css">
  <link rel="stylesheet" href="css/responsive.css">
</head>
<body>
  <header class="app-header">
    <img class="app-header__logo" src="imagen/logo-blanco.svg" alt="ACME AIR - Flying to your dreams">
  </header>

  <main class="app-card">
    <div class="usuario">
      <img class="usuario__avatar" src="imagen/iconos/avatar.svg" alt="Avatar de John Doe">
      <div class="usuario__datos">
        <p class="usuario__nombre">John Doe</p>
        <a class="usuario__salir" href="index.html">Cerrar Sesión</a>
      </div>
    </div>

    <h1>Check In</h1>
    <div class="tarjeta tarjeta--vuelo">
      <img class="tarjeta__icono" src="imagen/iconos/avion-despegando.svg" alt="">
      <div class="tarjeta__datos">
        <p class="tarjeta__detalle">05:30 - 06:30</p>
        <p class="tarjeta__detalle tarjeta__detalle--fuerte">1h 30 min</p>
        <p class="tarjeta__detalle">Bogotá - Barranquilla</p>
      </div>
      <p class="tarjeta__codigo">VAA025</p>
    </div>
    <form class="form" action="menu.html" method="get">
      <fieldset class="grupo">
        <legend class="grupo__titulo">Contacto En Caso De Emergencia</legend>
        <div class="campo">
          <label class="sr-only" for="contacto-nombre">Nombre completo</label>
          <input class="campo__input" type="text" id="contacto-nombre" name="contacto-nombre" placeholder="Nombre completo" autocomplete="off">
        </div>
        <div class="campo">
          <label class="sr-only" for="contacto-telefono">No. Teléfono Celular</label>
          <input class="campo__input" type="tel" id="contacto-telefono" name="contacto-telefono" placeholder="No. Teléfono Celular" autocomplete="off">
        </div>
        <button class="btn btn-primario" type="submit">Guardar</button>
      </fieldset>
    </form>
  </main>

  <footer class="app-footer">
    <small>© 2026 ACME AIR</small>
  </footer>
</body>
</html>
