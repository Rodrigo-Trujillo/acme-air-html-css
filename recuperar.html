<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Recuperar contraseña | ACME AIR</title>
  <meta name="description" content="Recuperar contraseña de ACME AIR">
  <link rel="icon" href="imagen/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/forms.css">
  <link rel="stylesheet" href="css/layout.css">
  <link rel="stylesheet" href="css/responsive.css">
</head>
<body>
  <header class="app-header">
    <img class="app-header__logo" src="imagen/logo-blanco.svg" alt="ACME AIR - Flying to your dreams">
  </header>

  <main class="app-card">
    <h1 class="titulo-divisor">Recuperar Contraseña</h1>
    <form class="form" action="crear-contraseña.html" method="get">
      <div class="campo">
        <label class="sr-only" for="email">Email</label>
        <input class="campo__input" type="email" id="email" name="email" placeholder="Email" autocomplete="email">
      </div>
      <p class="form__ayuda">Si el e-mail se encuentra registrado se enviará un link para continuar con la recuperación de su contraseña.</p>
      <button class="btn btn-primario" type="submit">Enviar</button>
    </form>
  </main>

  <footer class="app-footer">
    <small>© 2026 ACME AIR</small>
  </footer>
</body>
</html>
