<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Vuelos disponibles | ACME AIR</title>
  <meta name="description" content="Vuelos disponibles para tu búsqueda en ACME AIR">
  <link rel="icon" href="imagen/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/forms.css">
  <link rel="stylesheet" href="css/layout.css">
  <link rel="stylesheet" href="css/responsive.css">
</head>
<body>
  <header class="app-header">
    <img class="app-header__logo" src="imagen/logo-blanco.svg" alt="ACME AIR - Flying to your dreams">
  </header>

  <main class="app-card app-card--ancha">
    <div class="usuario">
      <img class="usuario__avatar" src="imagen/iconos/avatar.svg" alt="Avatar de John Doe">
      <div class="usuario__datos">
        <p class="usuario__nombre">John Doe</p>
        <a class="usuario__salir" href="index.html">Cerrar Sesión</a>
      </div>
    </div>

    <h1>Vuelos disponibles</h1>
    <p class="vuelos__ruta">Bogotá - Barranquilla<br>Septiembre - 29</p>
    <section class="lista-vuelos" aria-label="Vuelos disponibles">
      <a class="tarjeta tarjeta--vuelo" href="checkin.html">
        <img class="tarjeta__icono" src="imagen/iconos/avion-despegando.svg" alt="">
        <div class="tarjeta__datos">
          <p class="tarjeta__detalle">05:30 - 06:30</p>
          <p class="tarjeta__detalle tarjeta__detalle--fuerte">1h 30 min</p>
        </div>
        <div class="tarjeta__lateral">
          <p class="tarjeta__detalle">VAA025</p>
          <p class="tarjeta__precio">COP 150.600</p>
        </div>
      </a>
      <a class="tarjeta tarjeta--vuelo" href="checkin.html">
        <img class="tarjeta__icono" src="imagen/iconos/avion-despegando.svg" alt="">
        <div class="tarjeta__datos">
          <p class="tarjeta__detalle">10:30 - 12:05</p>
          <p class="tarjeta__detalle tarjeta__detalle--fuerte">1h 30 min</p>
        </div>
        <div class="tarjeta__lateral">
          <p class="tarjeta__detalle">VAA412</p>
          <p class="tarjeta__precio">COP 260.050</p>
        </div>
      </a>
      <a class="tarjeta tarjeta--vuelo" href="checkin.html">
        <img class="tarjeta__icono" src="imagen/iconos/avion-despegando.svg" alt="">
        <div class="tarjeta__datos">
          <p class="tarjeta__detalle">14:15 - 15:45</p>
          <p class="tarjeta__detalle tarjeta__detalle--fuerte">1h 30 min</p>
        </div>
        <div class="tarjeta__lateral">
          <p class="tarjeta__detalle">VAA836</p>
          <p class="tarjeta__precio">COP 150.600</p>
        </div>
      </a>
    </section>
    <a class="btn btn-primario" href="menu.html" title="Volver al menú principal">Volver</a>
  </main>

  <footer class="app-footer">
    <small>© 2026 ACME AIR</small>
  </footer>
</body>
</html>
